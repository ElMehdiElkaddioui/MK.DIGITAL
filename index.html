<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%PAGE_TITLE%</title>
    <meta name="description" content="%PAGE_DESCRIPTION%" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="author" content="MK DIGITAL — El Mehdi El Kaddioui" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!--mk:canonical-->

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MK DIGITAL" />
    <meta property="og:title" content="%PAGE_TITLE%" />
    <meta property="og:description" content="%PAGE_DESCRIPTION%" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MK DIGITAL — Web · E-commerce · Apps" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%PAGE_TITLE%" />
    <meta name="twitter:description" content="%PAGE_DESCRIPTION%" />
    <meta name="twitter:image" content="%OG_IMAGE%" />

    <link rel="preload" as="image" type="image/webp" href="/brand/mk-mark-640.webp" fetchpriority="high" />
    <!-- Boot shell: paints the mark before any JS; the React intro takes over at the same spot. -->
    <style>
      /* Safety net: if the app never takes over (JS blocked or failed), the shell fades away by itself. */
      #boot { position: fixed; inset: 0; z-index: 101; display: grid; place-items: center; background: #000; animation: boot-out 0.5s ease 6s forwards; }
      @keyframes boot-out { to { opacity: 0; visibility: hidden; } }
      #boot img { width: 110px; height: auto; }
      @media (min-width: 768px) { #boot img { width: 150px; } }
    </style>
    <noscript><style>#boot { display: none; }</style></noscript>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "MK DIGITAL",
        "description": "Studio de création web au Maroc : sites vitrines, e-commerce et applications web sur mesure.",
        "url": "%SITE_URL%",
        "logo": "%ABS%/icon-512.png",
        "image": "%OG_IMAGE%",
        "email": "mkdigitalweb7@gmail.com",
        "telephone": "+212762101493",
        "founder": { "@type": "Person", "name": "El Mehdi El Kaddioui" },
        "address": { "@type": "PostalAddress", "addressCountry": "MA" },
        "areaServed": { "@type": "Country", "name": "Maroc" },
        "knowsAbout": ["Création de sites web", "Développement e-commerce", "Applications web", "Design UI/UX", "Refonte de site web", "Maintenance de site web"],
        "sameAs": ["https://www.instagram.com/mkdigital.ma/"]
      }
    </script>
  </head>
  <body style="background:#000">
    <div id="boot" aria-hidden="true"><img src="/brand/mk-mark-640.webp" width="150" height="127" alt="" /></div>
    <div id="root"></div>
    <noscript>
      <h1>MK DIGITAL — Studio de création web au Maroc</h1>
      <p>Sites vitrines, boutiques e-commerce et applications web sur mesure. Fondé par El Mehdi El Kaddioui.</p>
      <p>
        <a href="https://wa.me/212762101493">WhatsApp +212 762 101 493</a> ·
        <a href="mailto:mkdigitalweb7@gmail.com">mkdigitalweb7@gmail.com</a> ·
        <a href="https://www.instagram.com/mkdigital.ma/">Instagram @mkdigital.ma</a>
      </p>
    </noscript>

    <!-- Static copy of the React contact form so Netlify Forms detects it at deploy time. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="whatsapp" />
      <select name="type"><option>Site vitrine</option></select>
      <select name="budget"><option>À définir ensemble</option></select>
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
